global:
  tenant: bethel-atlanta
  tenantDisplayName: Atlanta Bethel Church
  primaryLocale: ko
  secondaryLocale: en
  imagePullSecrets: []
  podAnnotations: {}
  commonEnv: {}
  metrics:
    scrapeAnnotations: true
  serviceAccount:
    create: true
    name: ""
    annotations: {}

ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  hosts:
    - host: pulpit-v2.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

apiService:
  enabled: true
  replicaCount: 1
  image:
    registry: 636305658578.dkr.ecr.us-east-1.amazonaws.com
    repository: pulpit-v2-dev/api-service
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources: {}
  env: {}
  command: []
  args: []

queryService:
  enabled: true
  replicaCount: 1
  image:
    registry: 636305658578.dkr.ecr.us-east-1.amazonaws.com
    repository: pulpit-v2-dev/query-service
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources: {}
  env: {}
  command: []
  args: []
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

ingestService:
  enabled: true
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  restartPolicy: OnFailure
  image:
    registry: 636305658578.dkr.ecr.us-east-1.amazonaws.com
    repository: pulpit-v2-dev/ingest-service
    tag: latest
    pullPolicy: IfNotPresent
  command: []
  args: []
  resources: {}
  env: {}
  metricsService:
    enabled: true
    port: 8000
    targetPort: 8000

observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
    queryServiceP95MsThreshold: 2000

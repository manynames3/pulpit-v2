apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: demo-church
  labels:
    app.kubernetes.io/part-of: pulpit-v2
    pulpit.ai/tenant: demo-church
spec:
  limits:
    - type: Container
      default:
        cpu: "300m"
        memory: 384Mi
      defaultRequest:
        cpu: "75m"
        memory: 96Mi
      max:
        cpu: "750m"
        memory: 768Mi
      min:
        cpu: "25m"
        memory: 64Mi

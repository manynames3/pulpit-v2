apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-compute-budget
  namespace: bethel-atlanta
  labels:
    app.kubernetes.io/part-of: pulpit-v2
    pulpit.ai/tenant: bethel-atlanta
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 8Gi
    services: "10"
    configmaps: "20"
    secrets: "20"
    persistentvolumeclaims: "2"
    count/jobs.batch: "20"
    count/cronjobs.batch: "2"

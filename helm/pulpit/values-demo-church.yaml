global:
  tenant: demo-church
  tenantDisplayName: Demo Church
  primaryLocale: en
  secondaryLocale: ko
  irsa:
    enabled: true
    roleArn: arn:aws:iam::636305658578:role/pulpit-v2-dev-demo-church-workload

ingress:
  enabled: true
  hosts:
    - host: demo.pulpit-v2.local
      paths:
        - path: /
          pathType: Prefix

externalSecrets:
  enabled: true
  data:
    - secretKey: AWS_REGION
      remoteRef:
        key: /pulpit-v2/shared/aws-region
    - secretKey: BEDROCK_MODEL_ID
      remoteRef:
        key: /pulpit-v2/demo-church/bedrock/model-id
    - secretKey: COGNITO_USER_POOL_ID
      remoteRef:
        key: /pulpit-v2/demo-church/cognito/user-pool-id
    - secretKey: COGNITO_APP_CLIENT_ID
      remoteRef:
        key: /pulpit-v2/demo-church/cognito/app-client-id
    - secretKey: SERMON_INDEX_BUCKET
      remoteRef:
        key: /pulpit-v2/demo-church/s3/index-bucket

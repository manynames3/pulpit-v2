name: Build Images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/build-push.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-service
          - query-service
          - ingest-service
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.service }}
        run: docker build -t pulpit-v2/${{ matrix.service }}:local ./services/${{ matrix.service }}

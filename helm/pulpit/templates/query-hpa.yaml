{{- if and .Values.queryService.enabled .Values.queryService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "pulpit.fullname" . }}-query
  labels:
    {{- include "pulpit.labels" . | nindent 4 }}
    app.kubernetes.io/component: query-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "pulpit.fullname" . }}-query
  minReplicas: {{ .Values.queryService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.queryService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.queryService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

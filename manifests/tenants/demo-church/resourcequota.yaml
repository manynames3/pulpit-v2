apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-compute-budget
  namespace: demo-church
  labels:
    app.kubernetes.io/part-of: pulpit-v2
    pulpit.ai/tenant: demo-church
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    limits.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    services: "6"
    configmaps: "12"
    secrets: "12"
    persistentvolumeclaims: "1"
    count/jobs.batch: "10"
    count/cronjobs.batch: "2"
